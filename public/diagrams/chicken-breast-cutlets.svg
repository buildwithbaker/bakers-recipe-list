<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 412" width="400" height="412" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Cutting chicken breasts into cutlets</title>
<desc id="d">Lay each breast flat with a hand pressed on top and slice it horizontally through the middle, keeping the knife level with the board. Each breast becomes two cutlets about three quarters of an inch thick. Lay the four cutlets on the rack with space between them.</desc>
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.th{font-size:14px;font-weight:600;fill:#1F3A5F}.ts{font-size:12.5px;fill:#4A4A4A}</style>
<text class="th" x="20" y="20">Slice through the middle, knife level</text>
<text class="ts" x="20" y="38">Side view. Press a flat hand on top as you cut</text>
<rect x="30" y="124" width="340" height="10" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.6"/>
<path d="M62,96 C58,60 130,52 210,64 C282,75 328,98 344,118 L344,124 L68,124 C62,118 61,108 62,96 Z" fill="#F2C4B8" stroke="#B9776A" stroke-width="0.9"/>
<path d="M58,92 C150,93 262,104 346,121" stroke="#6E3510" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/>
<rect x="2" y="86" width="22" height="12" rx="3" fill="#5F5E5A"/>
<polygon points="24,85 60,89 60,94 24,98" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="ts" x="100" y="154" text-anchor="middle">Thick end</text>
<text class="ts" x="318" y="154" text-anchor="middle">Thin tail</text>
<text class="th" x="20" y="192">You get two cutlets, about ¾ inch thick</text>
<path d="M72,208 C160,205 268,207 340,213 C348,216 348,225 340,227 C268,230 160,232 72,232 C67,224 67,214 72,208 Z" fill="#F2C4B8" stroke="#B9776A" stroke-width="0.9"/>
<path d="M72,250 C160,247 268,249 340,255 C348,258 348,267 340,269 C268,272 160,274 72,274 C67,266 67,256 72,250 Z" fill="#F2C4B8" stroke="#B9776A" stroke-width="0.9"/>
<g stroke="#5F5E5A" stroke-width="1.2"><line x1="54" y1="208" x2="54" y2="232"/><line x1="49" y1="208" x2="59" y2="208"/><line x1="49" y1="232" x2="59" y2="232"/></g>
<text class="ts" x="46" y="224" text-anchor="end">¾ in</text>
<text class="th" x="20" y="314">Four cutlets on the rack, with gaps</text>
<rect x="30" y="326" width="340" height="56" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.6"/>
<g stroke="#D3D1C7" stroke-width="0.6"><line x1="50" y1="326" x2="50" y2="382"/><line x1="90" y1="326" x2="90" y2="382"/><line x1="130" y1="326" x2="130" y2="382"/><line x1="170" y1="326" x2="170" y2="382"/><line x1="210" y1="326" x2="210" y2="382"/><line x1="250" y1="326" x2="250" y2="382"/><line x1="290" y1="326" x2="290" y2="382"/><line x1="330" y1="326" x2="330" y2="382"/></g>
<g fill="#F2C4B8" stroke="#B9776A" stroke-width="0.9">
<path d="M42,354 C42,336 72,332 92,338 C108,343 112,351 112,354 C112,358 106,366 92,370 C72,376 42,372 42,354 Z"/>
<path d="M127,354 C127,336 157,332 177,338 C193,343 197,351 197,354 C197,358 191,366 177,370 C157,376 127,372 127,354 Z"/>
<path d="M212,354 C212,336 242,332 262,338 C278,343 282,351 282,354 C282,358 276,366 262,370 C242,376 212,372 212,354 Z"/>
<path d="M297,354 C297,336 327,332 347,338 C363,343 367,351 367,354 C367,358 361,366 347,370 C327,376 297,372 297,354 Z"/></g>
<text class="ts" x="200" y="404" text-anchor="middle">Even thickness cooks evenly; gaps let it roast, not steam</text>
