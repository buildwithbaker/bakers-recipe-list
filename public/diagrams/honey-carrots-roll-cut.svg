<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 395" width="400" height="395" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Cutting carrots for honey carrots</title>
<desc id="d">Trim the stem and halve the thick top third lengthwise. Cut on an angle about three quarters of an inch apart, rolling the carrot a quarter turn between cuts, with shorter pieces at the fat end and longer pieces toward the tip. Lay the even chunks cut face down on the pan.</desc>
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.th{font-size:14px;font-weight:600;fill:#1F3A5F}.ts{font-size:12.5px;fill:#4A4A4A}</style>
<text class="th" x="20" y="20">Trim, then halve the fat top lengthwise</text>
<path d="M34,65 L14,58 M34,70 L10,70 M34,75 L14,82" stroke="#639922" stroke-width="3" stroke-linecap="round" fill="none"/>
<path d="M36,50 Q28,70 36,90 L365,73 Q380,70 365,67 Z" fill="#EF8A2C" stroke="#A9561B" stroke-width="0.8"/>
<line x1="44" y1="44" x2="44" y2="96" stroke="#A9561B" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="46" y1="70" x2="150" y2="70" stroke="#6E3510" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="ts" x="44" y="114" text-anchor="middle">Trim</text>
<text class="ts" x="150" y="114" text-anchor="middle">Halve this thick third</text>
<text class="th" x="20" y="150">Cut on an angle, about ¾ inch apart</text>
<text class="ts" x="20" y="168">Roll a quarter turn between cuts</text>
<path d="M36,190 Q28,210 36,230 L365,213 Q380,210 365,207 Z" fill="#EF8A2C" stroke="#A9561B" stroke-width="0.8"/>
<line x1="38" y1="210" x2="150" y2="210" stroke="#6E3510" stroke-width="1"/>
<g stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3">
<line x1="88" y1="187" x2="72" y2="233"/><line x1="128" y1="189" x2="112" y2="231"/>
<line x1="173" y1="192" x2="157" y2="228"/><line x1="223" y1="194" x2="207" y2="226"/>
<line x1="278" y1="197" x2="262" y2="223"/><line x1="338" y1="200" x2="322" y2="220"/></g>
<text class="ts" x="110" y="256" text-anchor="middle">Short at the fat end</text>
<text class="ts" x="290" y="256" text-anchor="middle">Longer toward the tip</text>
<text class="th" x="20" y="294">Even chunks, cut face down on the pan</text>
<rect x="30" y="306" width="340" height="50" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.6"/>
<g fill="#EF8A2C" stroke="#A9561B" stroke-width="0.8">
<polygon points="45,342 55,320 85,320 75,342"/><polygon points="99,342 109,320 139,320 129,342"/>
<polygon points="153,342 163,320 193,320 183,342"/><polygon points="207,342 217,320 247,320 237,342"/>
<polygon points="261,342 271,320 301,320 291,342"/><polygon points="315,342 325,320 355,320 345,342"/></g>
<text class="ts" x="200" y="384" text-anchor="middle">Same-size pieces finish at the same time</text>
</svg>
