name: CI
on:
  push:
    branches: [main]
  # Every PR, whatever its base: a stacked PR gets `verify` too, instead of
  # running unchecked until it is retargeted at main.
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The real work. Named `verify`, not `build`, because deploy.yml also has a
  # job called `build` and branch protection matches required checks BY NAME —
  # a gate written to mean "the job that runs the tests" could otherwise be
  # satisfied by a different workflow's job that happens to share the name.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # No --if-present: a check that silently vanishes when someone deletes
      # the script is not a check. Fail loudly instead.
      - run: npm run lint
      - run: npm test
      - run: npm run build
