name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The real work. Named `verify`, not `build`, because deploy.yml also has a
  # job called `build` and branch protection matches required checks BY NAME —
  # a gate written to mean "the job that runs the tests" could otherwise be
  # satisfied by a different workflow's job that happens to share the name.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # No --if-present: a check that silently vanishes when someone deletes
      # the script is not a check. Fail loudly instead.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # TRANSITIONAL ALIAS — DELETED IN STEP 3.
  #
  # `build` is currently the required status check on main. Renaming the job
  # above without this would emit no check by that name, the required context
  # would never report, and every PR would deadlock unable to merge.
  #
  # This job exists only to keep that context reporting until protection is
  # repointed from `build` to `verify` (step 2). It carries no logic of its own
  # and simply mirrors whether `verify` succeeded.
  #
  # It deliberately runs with `if: always()` and asserts the result explicitly,
  # rather than relying on `needs:` alone. A job skipped by an unmet `needs:`
  # reports the "skipped" conclusion, and GitHub treats a skipped required check
  # as satisfied — so a bare `needs: [verify]` alias would let a PR merge with a
  # RED verify. Failing loudly here keeps the alias honest.
  build:
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the verify result
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "verify concluded '${{ needs.verify.result }}', not 'success'."
            exit 1
          fi
          echo "verify succeeded."
